<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WGI Security Guard | เวลแอนด์กู๊ด รักษาความปลอดภัย</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+Thai:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#070c14;--navy:#0d1c33;--navy2:#132a4a;--steel:#5c6b82;--mist:#aab6c8;
  --amber:#d99a3a;--amber2:#f0b955;--paper:#f6f4ee;--card:#101f38;--line:#22314d;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
body{margin:0;background:var(--ink);color:var(--paper);font:400 16px/1.7 "Noto Sans Thai",system-ui,sans-serif;overflow-x:hidden}
.num{font-family:"Space Grotesk","Noto Sans Thai",sans-serif}
a{color:inherit;text-decoration:none}
::selection{background:var(--amber);color:#151515}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(7,12,20,.72);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{max-width:1180px;margin:auto;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px}
.brand img{height:38px;filter:drop-shadow(0 0 8px #00000066)}
.brand b{font:700 15px "Space Grotesk";letter-spacing:.02em}
.brand span{display:block;font-size:11px;color:var(--mist)}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav a{padding:9px 15px;border-radius:8px;font-weight:500;font-size:14.5px;color:var(--mist)}
nav a.on,nav a:hover{color:#fff;background:#ffffff0f}
.cta-top{background:var(--amber);color:#161005;font-weight:700;padding:9px 18px;border-radius:8px;white-space:nowrap}
.cta-top:hover{background:var(--amber2)}

.wrap{max-width:1180px;margin:auto;padding:0 22px}
.hero{position:relative;min-height:560px;display:flex;align-items:flex-end;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% 30%;opacity:.55}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--ink) 6%,rgba(7,12,20,.55) 55%,rgba(7,12,20,.15));}
.hero:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 900px 500px at 15% 20%,#0d1c3399,transparent 70%)}
.herobody{position:relative;padding:0 22px 64px;max-width:1180px;margin:auto;width:100%}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font:500 13px "Space Grotesk";color:var(--amber2);letter-spacing:.03em;margin-bottom:18px}
.dot{width:8px;height:8px;border-radius:50%;background:#38c76a;box-shadow:0 0 0 0 #38c76a66;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #38c76a55}70%{box-shadow:0 0 0 9px #38c76a00}100%{box-shadow:0 0 0 0 #38c76a00}}
h1{font:800 clamp(32px,5.4vw,58px)/1.18 "Noto Sans Thai";margin:0 0 18px;max-width:15em;letter-spacing:-.01em}
.hero p{max-width:34em;color:var(--mist);font-size:17px;margin:0 0 30px}
.btnrow{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:9px;background:var(--amber);color:#161005;font:700 15.5px "Noto Sans Thai";padding:14px 26px;border-radius:10px;border:0;cursor:pointer;transition:transform .18s,background .18s}
.btn:hover{background:var(--amber2);transform:translateY(-2px)}
.btn.gh{background:#ffffff12;color:#fff;border:1px solid #ffffff2e}
.btn.gh:hover{background:#ffffff1f}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-block:1px solid var(--line)}
.stat{background:var(--ink);padding:28px 18px;text-align:center}
.stat b{display:block;font:700 clamp(26px,3.4vw,40px) "Space Grotesk";color:var(--amber2)}
.stat span{font-size:13px;color:var(--mist)}

.sec{padding:76px 0}
.sec.tight{padding:52px 0}
.kicker{font:500 13px "Space Grotesk";color:var(--amber2);letter-spacing:.02em;margin:0 0 10px}
h2{font:800 clamp(24px,3.2vw,34px) "Noto Sans Thai";margin:0 0 12px}
.lead{color:var(--mist);max-width:42em;margin:0 0 36px;font-size:16px}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}
.tabs a{padding:9px 18px;border-radius:999px;border:1px solid var(--line);font-size:14px;font-weight:500;color:var(--mist)}
.tabs a.on,.tabs a:hover{background:var(--amber);color:#161005;border-color:var(--amber)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;display:block;position:relative;overflow:hidden}
a.card{transition:border-color .2s,transform .2s}
a.card:hover{border-color:var(--amber);transform:translateY(-4px)}
.ic{width:44px;height:44px;border-radius:10px;background:#ffffff10;display:grid;place-items:center;font-size:21px;margin-bottom:16px}
.card h3{margin:0 0 6px;font-size:18px}
.card p{margin:0;color:var(--mist);font-size:14.5px}
.arrow{position:absolute;right:22px;top:26px;color:var(--amber2);opacity:0;transition:opacity .2s,transform .2s}
a.card:hover .arrow{opacity:1;transform:translateX(3px)}

.split{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center}
.badgebar{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.badge{border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;color:var(--mist)}

.acc{border-top:1px solid var(--line)}
.acc details{border-bottom:1px solid var(--line);padding:18px 0}
.acc summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:20px;font-weight:700;font-size:15.5px}
.acc summary::-webkit-details-marker{display:none}
.acc summary:after{content:"+";font:400 22px "Space Grotesk";color:var(--amber2)}
.acc details[open] summary:after{content:"–"}
.acc p{color:var(--mist);margin:12px 0 0;max-width:44em;font-size:14.5px}

.quotewrap{background:var(--navy);border-radius:20px;padding:2px}
.quotebox{background:var(--card);border-radius:18px;padding:8px}
.ph{padding:52px 0 40px;background:linear-gradient(180deg,var(--navy),var(--ink))}
.crumb{font-size:13.5px;color:var(--mist);padding:16px 0}.crumb a{color:var(--amber2)}
.two{display:grid;grid-template-columns:230px 1fr;gap:26px;align-items:start}
.side{display:flex;flex-direction:column;gap:6px;position:sticky;top:82px}
.side a{padding:11px 15px;border-radius:9px;font-weight:500;font-size:14.5px;color:var(--mist);border:1px solid transparent}
.side a.on{background:var(--card);color:#fff;border-color:var(--line)}
.stats2{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px}
.stat2{text-align:center;width:104px}
.stat2 b{display:grid;place-items:center;width:96px;height:96px;margin:0 auto 8px;border-radius:50%;background:var(--card);color:var(--amber2);font:700 26px "Space Grotesk";border:3px solid var(--amber)}
.stat2 span{font-size:12.5px;color:var(--mist)}

form{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;display:grid;gap:15px}
label{font-size:13.5px;font-weight:500;color:var(--mist);display:grid;gap:6px}
input,select{font:15px "Noto Sans Thai";padding:12px 13px;border:1px solid var(--line);border-radius:9px;background:var(--ink);color:var(--paper);width:100%}
input:focus,select:focus{border-color:var(--amber)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.note{font-size:12.5px;color:var(--steel)}
#msg1,#msg2{font-weight:600;font-size:14px;min-height:20px}

footer{border-top:1px solid var(--line);padding:36px 0;font-size:14px;color:var(--mist)}
.fgrid{display:flex;justify-content:space-between;flex-wrap:wrap;gap:20px}

@media(max-width:820px){.split,.two,.r2{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.side{position:static;flex-direction:row;overflow-x:auto}.hero{min-height:auto}.herobody{padding-top:70px}}
</style></head>

function animateCounters(){document.querySelectorAll(".cnt").forEach(el=>{
  const to=+el.dataset.to,dur=900,t0=performance.now();
  requestAnimationFrame(function f(t){const p=Math.min(1,(t-t0)/dur);el.textContent=Math.round(to*p);if(p<1)requestAnimationFrame(f)});})}

function route(){const[k,a]=(location.hash.slice(2)||"home").split("/");const f=P[k]||P.home;
  $.innerHTML=f(decodeURIComponent(a||""));
  document.querySelectorAll("#nav a").forEach(x=>x.classList.toggle("on",x.dataset.k===k||(k==="apply"&&x.dataset.k==="careers")));
  window.scrollTo(0,0);
  if(k==="home"||!k)animateCounters();
  const fm=$.querySelector("form");if(fm)fm.onsubmit=send}

async function send(e){e.preventDefault();const f=e.target,m=f.querySelector("[id^=msg]"),b=f.querySelector("button");
  if(!SCRIPT_URL){m.textContent="ยังไม่ได้ตั้งค่า SCRIPT_URL ในโค้ด";return}
  const d=new URLSearchParams(new FormData(f));d.append("type",f.dataset.type);
  b.disabled=true;m.textContent="กำลังส่ง...";
  try{await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",body:d});f.reset();m.textContent="ส่งข้อมูลเรียบร้อย ขอบคุณค่ะ"}
  catch(x){m.textContent="ส่งไม่สำเร็จ ลองใหม่อีกครั้ง"}
  b.disabled=false}

addEventListener("hashchange",route);route();
</script>
</body></html>
